name: Validate tenant split

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/tenant-isolation-check.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tenant-split-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
      - name: Run smoke checks
        run: npm run smoke
      - name: Run tenant isolation checks
        run: npm run smoke:tenants
